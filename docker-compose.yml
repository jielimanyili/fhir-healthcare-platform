services:
  api:
    build: ./api
    container_name: fhir-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://fhir:fhir@postgres:5432/fhir
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: fhir-postgres
    environment:
      POSTGRES_USER: fhir
      POSTGRES_PASSWORD: fhir
      POSTGRES_DB: fhir
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhir"]
      interval: 5s
      timeout: 3s
      retries: 5

  ui:
    build: ./ui
    container_name: fhir-ui
    ports:
      - "4200:80"
    depends_on:
      - api
