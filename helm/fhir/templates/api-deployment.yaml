apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fhir.fullname" . }}-api
  labels:
    app: fhir-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: fhir-api
  template:
    metadata:
      labels:
        app: fhir-api
    spec:
      serviceAccountName: {{ .Values.api.serviceAccount }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}/{{ .Values.api.image }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            {{- range .Values.api.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
          args:
            - "--port=5432"
            - "{{ .Values.api.cloudSqlConnectionName }}"
          securityContext:
            runAsNonRoot: true
