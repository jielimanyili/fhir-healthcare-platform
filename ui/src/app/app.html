<main>
  <h1>FHIR Healthcare Analytics</h1>
  <p class="subtitle">HL7 FHIR R4 · Patient / Observation / Claim (synthetic data)</p>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <button (click)="load()">Refresh</button>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Gender</th>
        <th>Birth date</th>
      </tr>
    </thead>
    <tbody>
      @for (p of patients(); track p.id) {
        <tr>
          <td>{{ p.id }}</td>
          <td>{{ fullName(p) }}</td>
          <td>{{ p.gender }}</td>
          <td>{{ p.birthDate }}</td>
        </tr>
      }
    </tbody>
  </table>

  @if (loading()) {
    <p class="muted">Loading…</p>
  }
</main>
