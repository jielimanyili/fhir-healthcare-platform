server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy FHIR API calls. Defaults to the in-cluster service; set API_UPSTREAM
  # to the public API URL when running on Cloud Run.
  location /fhir/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Proxy Keycloak endpoints. Forcing Host to localhost:8080 keeps the token
  # "iss" equal to the API's OIDC_ISSUER (http://localhost:8080/realms/fhir).
  location /auth/ {
    proxy_pass ${AUTH_UPSTREAM}/;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:8080;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}


