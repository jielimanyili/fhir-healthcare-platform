server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy FHIR API calls to the in-cluster API service.
  location /fhir/ {
    proxy_pass http://fhir-api:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Proxy Keycloak endpoints. Forcing Host to localhost:8080 keeps the token
  # "iss" equal to the API's OIDC_ISSUER (http://localhost:8080/realms/fhir).
  location /auth/ {
    proxy_pass http://fhir-keycloak:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:8080;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

